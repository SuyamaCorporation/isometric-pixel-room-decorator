<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイソメトリックピクセルルームデコレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div class="max-w-5xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-cyan-300 mb-1">🏠 アイソメトリックルームデコレーター</h1>
  <p class="text-center text-slate-500 mb-3 text-sm">アイソメトリック視点でピクセルアート部屋を設計</p>

  <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
    <!-- Palette & Items -->
    <div class="bg-slate-800 rounded-xl p-3 space-y-3">
      <div>
        <div class="text-xs text-slate-400 mb-1">壁・床の色</div>
        <div class="grid grid-cols-3 gap-1" id="color-palette"></div>
      </div>
      <div>
        <div class="text-xs text-slate-400 mb-1">家具を配置</div>
        <div class="space-y-1" id="furniture-list"></div>
      </div>
      <div class="space-y-1">
        <button onclick="undoAction()" class="w-full py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded" aria-label="元に戻す">↩ Undo</button>
        <button onclick="clearRoom()" class="w-full py-1.5 bg-red-900/50 hover:bg-red-900 text-red-300 text-xs rounded" aria-label="クリア">🗑️ クリア</button>
        <button onclick="saveImg()" class="w-full py-1.5 bg-cyan-800 hover:bg-cyan-700 text-cyan-200 text-xs rounded" aria-label="PNG保存">💾 PNG保存</button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="md:col-span-4">
      <canvas id="room-canvas" width="560" height="400" class="w-full rounded-xl cursor-pointer border border-slate-700"></canvas>
      <div id="status" class="text-xs text-slate-500 mt-1 text-center">クリックして家具を配置、または壁・床を選んでクリック</div>
    </div>
  </div>
</div>

<script>
const COLORS = [
  { name:'白壁', wall:'#e8e0d0', floor:'#c8b89a', shadow:'#b0a080' },
  { name:'木材', wall:'#d4a76a', floor:'#b8894e', shadow:'#9a6a30' },
  { name:'石材', wall:'#9ca3af', floor:'#6b7280', shadow:'#4b5563' },
  { name:'青壁', wall:'#bfdbfe', floor:'#93c5fd', shadow:'#60a5fa' },
  { name:'緑壁', wall:'#bbf7d0', floor:'#86efac', shadow:'#4ade80' },
  { name:'夜の部屋', wall:'#1e3a5f', floor:'#1e2d4f', shadow:'#152138' },
];

const FURNITURE = [
  { name:'ベッド', emoji:'🛏️', w:3, h:2, colors:['#f5deb3','#8b4513','#8b4513'] },
  { name:'ソファ', emoji:'🛋️', w:3, h:1, colors:['#4a90d9','#2c5f8a','#1a3d5c'] },
  { name:'テーブル', emoji:'🪑', w:2, h:2, colors:['#deb887','#8b6914','#6b4f10'] },
  { name:'本棚', emoji:'📚', w:1, h:3, colors:['#8b4513','#654321','#4a2f1a'] },
  { name:'植物', emoji:'🪴', w:1, h:1, colors:['#228b22','#166016','#0d3d0d'] },
  { name:'テレビ', emoji:'📺', w:2, h:1, colors:['#2d2d2d','#1a1a1a','#0d0d0d'] },
  { name:'ラグ', emoji:'🟥', w:3, h:2, colors:['#dc143c','#8b0000','#4b0000'] },
  { name:'窓', emoji:'🪟', w:2, h:2, colors:['#87ceeb','#4682b4','#1e3a5f'] },
  { name:'ドア', emoji:'🚪', w:1, h:2, colors:['#8b4513','#654321','#3d2810'] },
  { name:'ランプ', emoji:'💡', w:1, h:1, colors:['#ffd700','#ffa500','#cc6600'] },
];

const ISO_W = 48, ISO_H = 24, TILE_H = 20;
const GRID_W = 10, GRID_H = 10;
let currentColor = COLORS[0];
let selectedFurniture = null;
let placed = [];
let history = [];

const canvas = document.getElementById('room-canvas');
const ctx = canvas.getContext('2d');

function isoToScreen(gx, gy) {
  const ox = canvas.width / 2;
  const oy = 60;
  return {
    x: ox + (gx - gy) * ISO_W / 2,
    y: oy + (gx + gy) * ISO_H / 2,
  };
}

function drawTile(gx, gy, topColor, leftColor, rightColor) {
  const { x, y } = isoToScreen(gx, gy);
  // Top face
  ctx.fillStyle = topColor;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + ISO_W/2, y + ISO_H/2);
  ctx.lineTo(x, y + ISO_H);
  ctx.lineTo(x - ISO_W/2, y + ISO_H/2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth=0.5; ctx.stroke();
}

function drawBox(gx, gy, h, colors) {
  const { x, y } = isoToScreen(gx, gy);
  const bh = h * TILE_H;
  // Left face
  ctx.fillStyle = colors[1];
  ctx.beginPath();
  ctx.moveTo(x - ISO_W/2, y + ISO_H/2);
  ctx.lineTo(x, y + ISO_H);
  ctx.lineTo(x, y + ISO_H + bh);
  ctx.lineTo(x - ISO_W/2, y + ISO_H/2 + bh);
  ctx.closePath(); ctx.fill();
  // Right face
  ctx.fillStyle = colors[2];
  ctx.beginPath();
  ctx.moveTo(x + ISO_W/2, y + ISO_H/2);
  ctx.lineTo(x, y + ISO_H);
  ctx.lineTo(x, y + ISO_H + bh);
  ctx.lineTo(x + ISO_W/2, y + ISO_H/2 + bh);
  ctx.closePath(); ctx.fill();
  // Top face
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.moveTo(x, y - bh);
  ctx.lineTo(x + ISO_W/2, y + ISO_H/2 - bh);
  ctx.lineTo(x, y + ISO_H - bh);
  ctx.lineTo(x - ISO_W/2, y + ISO_H/2 - bh);
  ctx.closePath(); ctx.fill();
}

function drawRoom() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#1e293b'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Floor
  for(let gx=0;gx<GRID_W;gx++) {
    for(let gy=0;gy<GRID_H;gy++) {
      drawTile(gx, gy, currentColor.floor, currentColor.wall, currentColor.shadow);
    }
  }

  // Back walls
  for(let gx=0;gx<GRID_W;gx++) {
    const p = isoToScreen(gx, 0);
    const p2 = isoToScreen(gx+1, 0);
    ctx.fillStyle = currentColor.wall;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 80);
    ctx.lineTo(p2.x, p2.y - 80); ctx.lineTo(p2.x, p2.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=0.5; ctx.stroke();
  }
  for(let gy=0;gy<GRID_H;gy++) {
    const p = isoToScreen(0, gy);
    const p2 = isoToScreen(0, gy+1);
    ctx.fillStyle = currentColor.shadow;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 80);
    ctx.lineTo(p2.x, p2.y - 80); ctx.lineTo(p2.x, p2.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=0.5; ctx.stroke();
  }

  // Placed items
  placed.forEach(item => {
    drawBox(item.gx, item.gy, item.h || 1, item.colors);
    // Label
    const { x, y } = isoToScreen(item.gx, item.gy);
    ctx.font = '16px sans-serif'; ctx.textAlign='center';
    ctx.fillText(item.emoji, x, y - (item.h||1)*TILE_H + 8);
  });
}

function screenToGrid(mx, my) {
  const ox = canvas.width / 2;
  const oy = 60;
  const dx = mx - ox;
  const dy = my - oy;
  const gx = Math.round((dx/ISO_W + dy/ISO_H) / 1);
  const gy = Math.round((dy/ISO_H - dx/ISO_W) / 1);
  return { gx, gy };
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width;
  const scaleY = canvas.height/rect.height;
  const mx = (e.clientX-rect.left)*scaleX;
  const my = (e.clientY-rect.top)*scaleY;
  const { gx, gy } = screenToGrid(mx, my);

  if (gx < 0 || gx >= GRID_W || gy < 0 || gy >= GRID_H) return;

  if (selectedFurniture) {
    history.push([...placed]);
    placed.push({ ...selectedFurniture, gx, gy });
    drawRoom();
    document.getElementById('status').textContent = `${selectedFurniture.name}を (${gx},${gy})に配置しました`;
  }
});

function undoAction() {
  if (history.length === 0) return;
  placed = history.pop();
  drawRoom();
}

function clearRoom() {
  history.push([...placed]);
  placed = [];
  drawRoom();
}

function saveImg() {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'isometric-room.png';
  a.click();
}

function renderPalette() {
  const el = document.getElementById('color-palette');
  el.innerHTML = COLORS.map((c, i) => `
    <button onclick="setColor(${i})" class="rounded py-1 text-xs text-center ${currentColor===c?'ring-2 ring-cyan-400':''}" style="background:${c.floor}" aria-label="${c.name}">${c.name}</button>
  `).join('');
}

function setColor(i) {
  currentColor = COLORS[i];
  renderPalette();
  drawRoom();
}

function renderFurniture() {
  const el = document.getElementById('furniture-list');
  el.innerHTML = FURNITURE.map((f, i) => `
    <button onclick="selectFurniture(${i})" id="furn-${i}" class="w-full text-left px-2 py-1 rounded text-xs ${selectedFurniture===f?'bg-cyan-800 text-white':'bg-slate-700 text-slate-300'} hover:bg-slate-600" aria-label="${f.name}">${f.emoji} ${f.name}</button>
  `).join('');
}

function selectFurniture(i) {
  selectedFurniture = FURNITURE[i];
  renderFurniture();
  document.getElementById('status').textContent = `${selectedFurniture.name}を選択中。グリッドをクリックして配置`;
}

renderPalette();
renderFurniture();
drawRoom();
</script>
</body>
</html>
